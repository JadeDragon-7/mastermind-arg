<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Control Room</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #111;

            color: #ddd;

            font-family:
                Arial,
                sans-serif;

        }


        /* ========================================
           ADMIN PANEL
        ======================================== */

        #adminPanel {

            width: 700px;

            max-width:
                calc(100vw - 40px);

            margin: 60px auto;

            background: #181818;

            border:
                1px solid #555;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.6);

        }


        /* ========================================
           HEADER
        ======================================== */

        #adminHeader {

            padding: 18px;

            background: #0b0b0b;

            border-bottom:
                1px solid #555;

            color: #ddd;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 2px;

        }


        /* ========================================
           ADMIN INFORMATION
        ======================================== */

        #adminInfo {

            padding:
                15px 25px;

            background: #151515;

            border-bottom:
                1px solid #333;

            color: #888;

            font-size: 12px;

        }


        #adminUsername {

            color:
                #3498DB;

            font-weight: bold;

        }


        /* ========================================
           SECTIONS
        ======================================== */

        .adminSection {

            padding: 25px;

        }


        .sectionTitle {

            margin-bottom: 20px;

            color:
                #3498DB;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

        }


        /* ========================================
           LABELS
        ======================================== */

        .adminSection label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            color: #999;

            font-size: 11px;

            letter-spacing: 1px;

        }


        /* ========================================
           INPUTS
        ======================================== */

        .adminSection input,
        .adminSection textarea {

            width: 100%;

            padding: 10px;

            background: #0d0d0d;

            border:
                1px solid #444;

            color: #ddd;

            font-family: inherit;

            font-size: 14px;

        }


        .adminSection textarea {

            resize: vertical;

            min-height: 100px;

        }


        .adminSection input:focus,
        .adminSection textarea:focus {

            outline: none;

            border-color:
                #3498DB;

        }


        /* ========================================
           BUTTON
        ======================================== */

        #updateGameState {

            margin-top: 25px;

            padding:
                11px 20px;

            background:
                #3498DB;

            border: none;

            color: white;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

        }


        #updateGameState:hover {

            filter:
                brightness(1.15);

        }


        #updateGameState:disabled {

            opacity: 0.5;

            cursor:
                not-allowed;

        }


        /* ========================================
           RESULT MESSAGE
        ======================================== */

        #updateResult {

            margin-top: 15px;

            min-height: 20px;

            font-size: 12px;

        }


        /* ========================================
           LOG OUT
        ======================================== */

        #logoutButton {

            margin:
                0 25px 25px 25px;

            padding:
                8px 15px;

            background:
                transparent;

            border:
                1px solid #555;

            color: #aaa;

            cursor: pointer;

        }


        #logoutButton:hover {

            border-color:
                #3498DB;

            color:
                #3498DB;

        }


        /* ========================================
           ACCESS DENIED
        ======================================== */

        #accessDenied {

            display: none;

            padding: 40px;

            text-align: center;

        }


        #accessDenied h2 {

            color:
                #e74c3c;

            letter-spacing: 2px;

        }

/* ========================================
   APPLICATION CONTROLS
======================================== */

#applicationsList {

    display: flex;

    flex-direction: column;

    gap: 8px;

}


.adminApplication {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px;

    background: #0d0d0d;

    border: 1px solid #333;

}


.adminApplicationInfo {

    display: flex;

    align-items: center;

    gap: 12px;

}


.adminApplicationIcon {

    width: 32px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 20px;

}


.adminApplicationName {

    color: #ddd;

    font-size: 13px;

}


.adminApplicationDescription {

    margin-top: 3px;

    color: #666;

}


/* ========================================
   UNLOCK BUTTON
======================================== */

.applicationToggle {

    width: 100px;
    min-width: 100px;
    height: 30px;

    padding: 0 12px;

    border: 1px solid #555;

    background: transparent;

    color: #888;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    flex-shrink: 0;

}


.applicationToggle:hover {

    border-color:
        #3498DB;

    color:
        #3498DB;

}


.applicationToggle.unlocked {

    border-color:
        #3498DB;

    color:
        #3498DB;

}


.applicationToggle.locked {

    border-color:
        #555;

    color:
        #666;

}

/* ========================================
   HANGMAN CONTROLS
======================================== */

#hangmanGamesList {
    display: flex;
    flex-direction: column;
    gap: 10px;
}


/* Individual game row */

.adminHangmanGame {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    padding: 14px;

    background: #0d0d0d;

    border: 1px solid #333;

}


/* Game information */

.adminHangmanInfo {

    display: flex;

    flex-direction: column;

    gap: 4px;

    min-width: 0;

}


.adminHangmanPlayer {

    color: #ddd;

    font-size: 13px;

    font-weight: bold;

}


.adminHangmanDetails {

    color: #666;

    font-size: 10px;

    letter-spacing: 1px;

}


/* Status */

.adminHangmanStatus {

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;

}


/* Action buttons */

.adminHangmanActions {

    display: flex;

    gap: 6px;

    flex-shrink: 0;

}


.hangmanAdminButton {

    height: 30px;

    padding: 0 10px;

    border: 1px solid #555;

    background: transparent;

    color: #888;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

}


.hangmanAdminButton:hover {

    border-color: #3498DB;

    color: #3498DB;

}


/* Unlock button */

.hangmanUnlockButton {

    border-color: #3498DB;

    color: #3498DB;

}


/* Reset button */

.hangmanResetButton:hover {

    border-color: #e74c3c;

    color: #e74c3c;

}


/* Disabled buttons */

.hangmanAdminButton:disabled {

    opacity: 0.4;

    cursor: not-allowed;

}

.hangmanProgress {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    margin-bottom: 12px;
}

.hangmanDot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #333;
    border: 1px solid #555;
}

.hangmanDot.filled {
    background: #fff;
    border-color: #fff;
}

.hangmanCorrectLetters {
    margin-top: 8px;
    margin-bottom: 8px;
    font-family: monospace;
    letter-spacing: 3px;
}

.hangmanCorrectLetters span {
    display: inline-block;
    margin-right: 6px;
}

/* ========================================
   HANGMAN GAME NAME
======================================== */

.hangmanGameName {
    display: flex;
    gap: 6px;
    margin-top: 8px;
}

.hangmanGameName input {
    flex: 1;

    height: 30px;

    padding: 0 8px;

    background: #0d0d0d;
    border: 1px solid #444;

    color: #ddd;

    font-family: inherit;
    font-size: 11px;
}

.hangmanGameName input:focus {
    outline: none;
    border-color: #3498DB;
}

.hangmanNameSave {
    height: 30px;

    padding: 0 10px;

    background: transparent;

    border: 1px solid #555;

    color: #888;

    font-size: 9px;
    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;
}

.hangmanNameSave:hover {
    border-color: #3498DB;
    color: #3498DB;
}

.hangmanNameSave:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}


    </style>

</head>

    <script>


        /* ========================================

        const SUPABASE_URL = "https://fyhxgigfatooxkxlxipz.supabase.co";

        /* ========================================
           LOAD CURRENT GAME STATE
        ======================================== */

        async function loadGameState() {


            const {
                data: gameState,
                error
            } = await supabaseClient

                .from("game_state")

                .select(
                    "current_chapter, system_status, system_message"
                )

                .eq("id", 1)

                .single();


            if (error) {

                console.error(
                    "GAME STATE ERROR:",
                    error
                );

                updateResult.textContent =
                    "COULD NOT LOAD GAME STATE.";

                return;

            }


            systemStatusInput.value =
                gameState.system_status || "";


            systemMessageInput.value =
                gameState.system_message || "";


            chapterInput.value =
                gameState.current_chapter || 1;

        }



async function toggleApplication(
    application,
    button
) {

    /*
     * Prevent a second click while the
     * current database request is running.
     */

    if (button.dataset.updating === "true") {
        return;
    }


    button.dataset.updating = "true";


    /*
     * Read the CURRENT button state.
     */

    const currentState =
        button.dataset.unlocked === "true";


    const newState =
        !currentState;


    /*
     * Remember the old appearance.
     */

    updateApplicationButton(
        button,
        newState
    );


    console.log(
        "APPLICATION TOGGLE:",
        application.id,
        currentState,
        "→",
        newState
    );


    try {

        const {
            error
        } = await supabaseClient

            .from("applications")

            .update({
                unlocked: newState
            })

            .eq(
                "id",
                application.id
            );


        /*
         * Database error
         */

        if (error) {

            console.error(
                "APPLICATION UPDATE ERROR:",
                error
            );


            /*
             * Undo the visual change.
             */

            updateApplicationButton(
                button,
                currentState
            );


            return;

        }


        /*
         * Database succeeded.
         *
         * Update our local state.
         */

        application.unlocked =
            newState;


        button.dataset.unlocked =
            String(newState);


        console.log(
            "APPLICATION UPDATED:",
            application.id,
            newState
        );


    } catch (error) {

        console.error(
            "APPLICATION ERROR:",
            error
        );


        /*
         * Undo the visual change.
         */

        updateApplicationButton(
            button,
            currentState
        );


    } finally {

        /*
         * Allow another click.
         */

        button.dataset.updating =
            "false";

    }

}

function updateApplicationButton(
    button,
    unlocked
) {

    if (unlocked) {

        button.textContent =
            "UNLOCKED";

        button.classList.add(
            "unlocked"
        );

        button.classList.remove(
            "locked"
        );

    } else {

        button.textContent =
            "LOCKED";

        button.classList.add(
            "locked"
        );

        button.classList.remove(
            "unlocked"
        );

    }

}

async function loadApplications() {

    const applicationsList =
        document.getElementById(
            "applicationsList"
        );


    applicationsList.textContent =
        "LOADING APPLICATIONS...";


    const {
        data: applications,
        error
    } = await supabaseClient

        .from("applications")

        .select(
            "id, name, display_name, icon, description, unlocked"
        )

        .order(
            "id",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "APPLICATION ERROR:",
            error
        );

        applicationsList.textContent =
            "COULD NOT LOAD APPLICATIONS.";

        return;

    }


    applicationsList.innerHTML = "";


    applications.forEach(
        (application) => {

            /*
             * Create row
             */

const row =
    document.createElement(
        "div"
    );

row.className =
    "adminApplication";

row.dataset.applicationId =
    application.id;


            /*
             * Application information
             */

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "adminApplicationInfo";


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "adminApplicationIcon";

            icon.textContent =
                application.icon || "□";


            const text =
                document.createElement(
                    "div"
                );


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "adminApplicationName";

            name.textContent =
                application.display_name ||
                application.name;


            const description =
                document.createElement(
                    "div"
                );

            description.className =
                "adminApplicationDescription";

            description.textContent =
                application.description || "";


            text.appendChild(
                name
            );

            text.appendChild(
                description
            );


            info.appendChild(
                icon
            );

            info.appendChild(
                text
            );


            /*
 * Create toggle button
 */

const button =
    document.createElement(
        "button"
    );

button.className =
    "applicationToggle";


button.dataset.unlocked =
    String(application.unlocked);

button.dataset.updating =
    "false";


/*
 * Set initial appearance
 */

updateApplicationButton(
    button,
    application.unlocked
);


/*
 * Toggle application
 */

button.addEventListener(
    "click",
    () => {

        toggleApplication(
            application,
            button
        );

    }
);


            /*
             * Assemble row
             */

            row.appendChild(
                info
            );

            row.appendChild(
                button
            );


            applicationsList.appendChild(
                row
            );

        }
    );

}

        /* ========================================
           CHECK ADMIN
        ======================================== */

        async function checkAdmin() {


            /*
             * Check login
             */

            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth
                    .getSession();


            if (!session) {

                window.location.href =
                    "login.html";

                return;

            }



            /*
             * Get player profile
             */

            const {
                data: player,
                error
            } =
                await supabaseClient

                    .from("players")

                    .select(
                        "username, access_level"
                    )

                    .eq(
                        "user_id",
                        session.user.id
                    )

                    .single();



            if (error) {

                console.error(
                    "PLAYER ERROR:",
                    error
                );

                gameStateSection.style.display =
                    "none";

                return;

            }



            /*
             * Display player
             */

            adminUsername.textContent =
                player.username;


            adminAccessLevel.textContent =
                player.access_level;



            /*
             * Check administrator access
             *
             * 3 = administrator
             */

            if (
                player.access_level < 3
            ) {

                gameStateSection.style.display =
                    "none";

                accessDenied.style.display =
                    "block";

                return;

            }



            /*
             * Administrator
             */

await loadGameState();
await loadApplications();
await loadHangmanGames();
subscribeToHangmanAdmin();

        }


/* ========================================
   LOAD HANGMAN GAMES
======================================== */

async function loadHangmanGames() {

    hangmanGamesList.textContent =
        "LOADING HANGMAN GAMES...";


    /*
     * Get all Hangman games
     */

    const {
        data: games,
        error: gameError
    } = await supabaseClient
        .from("hangman_games")
        .select("*")
        .order(
            "player_id",
            {
                ascending: true
            }
        )
        .order(
            "tab_number",
            {
                ascending: true
            }
        );


    if (gameError) {

        console.error(
            "HANGMAN ERROR:",
            gameError
        );

        hangmanGamesList.textContent =
            "COULD NOT LOAD HANGMAN GAMES.";

        return;

    }


    /*
     * Get all players
     */

    const {
        data: players,
        error: playerError
    } = await supabaseClient
        .from("players")
        .select(
            "user_id, username"
        );


    if (playerError) {

        console.error(
            "PLAYER ERROR:",
            playerError
        );

        hangmanGamesList.textContent =
            "COULD NOT LOAD PLAYERS.";

        return;

    }


    /*
     * Create a quick lookup table
     */

    const playerNames = {};

    players.forEach(player => {

        playerNames[player.user_id] =
            player.username;

    });


    /*
     * Nothing found
     */

    if (!games || games.length === 0) {

        hangmanGamesList.textContent =
            "NO HANGMAN GAMES.";

        return;

    }


    /*
     * Clear loading message
     */

    hangmanGamesList.innerHTML = "";


    /*
     * Create each game row
     */

games.forEach(game => {

    const row = createHangmanAdminRow(
        game,
        playerNames[game.player_id] ||
        "UNKNOWN PLAYER"
    );

    hangmanGamesList.appendChild(row);

});

}

/* ========================================
   REALTIME HANGMAN ADMIN UPDATES
======================================== */

function subscribeToHangmanAdmin() {

    supabaseClient
        .channel("hangman-admin")
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "hangman_games"
            },
            payload => {

                console.log(
                    "HANGMAN ADMIN REALTIME UPDATE:",
                    payload
                );

                // Reload the Hangman list
                loadHangmanGames();

            }
        )
        .subscribe(
            status => {

                console.log(
                    "HANGMAN ADMIN REALTIME STATUS:",
                    status
                );

            }
        );

}

/* ========================================
   CREATE HANGMAN ADMIN ROW
======================================== */

function createHangmanAdminRow(game, username) {
    const row = document.createElement("div");
    row.className = "adminHangmanGame";

    const guessedLetters = game.guessed_letters || [];
    const word = (game.word || "").toUpperCase();

    // Find letters that were guessed correctly
    const correctLetters = [...new Set(
        guessedLetters.filter(letter =>
            word.includes(letter.toUpperCase())
        )
    )];

    // Create the 6-dot Hangman progress indicator
    let progressDots = "";

    for (let i = 0; i < 6; i++) {
        progressDots += `
            <span class="hangmanDot ${i < game.wrong_guesses ? "filled" : ""}"></span>
        `;
    }

    // Display correct letters
    const correctLettersHTML = correctLetters.length
        ? correctLetters.map(letter => `<span>${letter}</span>`).join("")
        : "—";

    row.innerHTML = `
        <div class="adminHangmanInfo">

<div class="adminHangmanPlayer">
    ${username || "UNKNOWN PLAYER"} — GAME ${game.tab_number}
</div>

<div class="hangmanGameName">

    <input
        type="text"
        class="hangmanNameInput"
        value="${game.game_name || ""}"
        placeholder="GAME NAME"
        maxlength="40"
        data-id="${game.id}"
    >

    <button
        class="hangmanNameSave"
        data-id="${game.id}">
        SAVE
    </button>

</div>

            <div class="adminHangmanDetails">

                <div>
                    WRONG GUESSES: ${game.wrong_guesses} / 6
                </div>

                <div class="hangmanProgress">
                    ${progressDots}
                </div>

                <div class="hangmanCorrectLetters">
                    CORRECT LETTERS:
                    ${correctLettersHTML}
                </div>

                <div>
                    GUESSES: ${game.guess_number}
                </div>

                <div class="adminHangmanStatus">
                    STATUS:
                    ${
                        game.status === "won"
                            ? "WON"
                            : game.status === "lost"
                                ? "LOST"
                                : game.guess_unlocked
                                    ? "UNLOCKED"
                                    : "LOCKED"
                    }
                </div>

            </div>

            <div class="adminHangmanActions">

                ${
                    game.status === "playing" && !game.guess_unlocked
                        ? `<button
                                class="hangmanAdminButton hangmanUnlockButton"
                                data-id="${game.id}">
                                UNLOCK
                           </button>`
                        : ""
                }

                <button
                    class="hangmanAdminButton hangmanResetButton"
                    data-id="${game.id}">
                    RESET
                </button>

            </div>

        </div>
    `;

    // Unlock button
    const unlockButton = row.querySelector(".hangmanUnlockButton");

    if (unlockButton) {
        unlockButton.addEventListener("click", () => {
            unlockHangmanGame(game, unlockButton);
        });
    }

    // Game name save button
const nameInput =
    row.querySelector(".hangmanNameInput");

const nameSaveButton =
    row.querySelector(".hangmanNameSave");

if (nameSaveButton) {

    nameSaveButton.addEventListener(
        "click",
        () => {

            saveHangmanGameName(
                game,
                nameInput,
                nameSaveButton
            );

        }
    );

}

    // Reset button
    const resetButton = row.querySelector(".hangmanResetButton");

    if (resetButton) {
        resetButton.addEventListener("click", () => {
            resetHangmanGame(game, resetButton);
        });
    }

    return row;
}

/* ========================================
   UNLOCK HANGMAN GAME
======================================== */

async function unlockHangmanGame(
    game,
    button
) {

    if (button.disabled) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "UPDATING...";


    const {
        error
    } = await supabaseClient
        .from("hangman_games")
        .update({

            guess_unlocked:
                true

        })
        .eq(
            "id",
            game.id
        );


    if (error) {

        console.error(
            "HANGMAN UNLOCK ERROR:",
            error
        );

        button.disabled = false;

        button.textContent =
            "UNLOCK";

        return;

    }


    /*
     * Refresh the entire list
     */

    await loadHangmanGames();

}


/* ========================================
   RESET HANGMAN GAME
======================================== */

async function resetHangmanGame(
    game,
    button
) {

    /*
     * Confirmation
     */

    const confirmed =
        confirm(
            `RESET GAME ${game.tab_number} FOR THIS PLAYER?\n\n` +
            `ALL PROGRESS WILL BE ERASED.`
        );


    if (!confirmed) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "RESETTING...";


    /*
     * Reset the puzzle
     */

    const {
        error
    } = await supabaseClient
        .from("hangman_games")
        .update({

            guessed_letters: [],

            wrong_guesses: 0,

            guess_number: 0,

            guess_unlocked: true,

            status: "playing",

            completed_at: null

        })
        .eq(
            "id",
            game.id
        );


    if (error) {

        console.error(
            "HANGMAN RESET ERROR:",
            error
        );

        alert(
            "RESET FAILED."
        );

        button.disabled = false;

        button.textContent =
            "RESET";

        return;

    }


    /*
     * Refresh admin display
     */

    await loadHangmanGames();

}

/* ========================================
   SAVE HANGMAN GAME NAME
======================================== */

async function saveHangmanGameName(game, input, button) {

    if (button.disabled) {
        return;
    }

    const newName = input.value.trim();

    button.disabled = true;
    button.textContent = "SAVING...";

    const { error } = await supabaseClient
        .from("hangman_games")
        .update({
            game_name: newName || null
        })
        .eq("id", game.id);

    if (error) {

        console.error(
            "HANGMAN NAME UPDATE ERROR:",
            error
        );

        button.disabled = false;
        button.textContent = "SAVE";

        alert("NAME SAVE FAILED.");

        return;
    }

    button.textContent = "SAVED";

    setTimeout(() => {

        button.disabled = false;
        button.textContent = "SAVE";

    }, 1000);
}



        /* ========================================
           UPDATE GAME STATE
        ======================================== */

        updateGameState.addEventListener(
            "click",
            async () => {


                updateResult.textContent =
                    "UPDATING...";


                updateGameState.disabled =
                    true;



                /*
                 * Get values
                 */

                const status =
                    systemStatusInput.value.trim();


                const message =
                    systemMessageInput.value.trim();


                const chapter =
                    Number(
                        chapterInput.value
                    );



                /*
                 * Validate chapter
                 */

                if (
                    !Number.isInteger(
                        chapter
                    ) ||
                    chapter < 1
                ) {

                    updateResult.textContent =
                        "INVALID CHAPTER.";

                    updateGameState.disabled =
                        false;

                    return;

                }



                /*
                 * ONE database update
                 *
                 * This changes all three
                 * values at once.
                 */

                const {
                    error
                } = await supabaseClient

                    .from("game_state")

                    .update({

                        system_status:
                            status,

                        system_message:
                            message,

                        current_chapter:
                            chapter

                    })

                    .eq(
                        "id",
                        1
                    );



                /*
                 * Error
                 */

                if (error) {

                    console.error(
                        "GAME STATE UPDATE ERROR:",
                        error
                    );

                    updateResult.textContent =
                        "UPDATE FAILED: " +
                        error.message;

                    updateGameState.disabled =
                        false;

                    return;

                }



                /*
                 * Success
                 */

                updateResult.textContent =
                    "SYSTEM UPDATED.";


                updateGameState.disabled =
                    false;

            }
        );



        /* ========================================
           LOG OUT
        ======================================== */

        logoutButton.addEventListener(
            "click",
            async () => {

                await supabaseClient
                    .auth
                    .signOut();

                window.location.href =
                    "login.html";

            }
        );



        /* ========================================
           START
        ======================================== */

        checkAdmin();


    </script>


</body>
