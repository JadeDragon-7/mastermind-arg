<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Control Room</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #111;

            color: #ddd;

            font-family:
                Arial,
                sans-serif;

        }


        /* ========================================
           ADMIN PANEL
        ======================================== */

        #adminPanel {

            width: 700px;

            max-width:
                calc(100vw - 40px);

            margin: 60px auto;

            background: #181818;

            border:
                1px solid #555;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.6);

        }


        /* ========================================
           HEADER
        ======================================== */

        #adminHeader {

            padding: 18px;

            background: #0b0b0b;

            border-bottom:
                1px solid #555;

            color: #ddd;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 2px;

        }


        /* ========================================
           ADMIN INFORMATION
        ======================================== */

        #adminInfo {

            padding:
                15px 25px;

            background: #151515;

            border-bottom:
                1px solid #333;

            color: #888;

            font-size: 12px;

        }


        #adminUsername {

            color:
                #3498DB;

            font-weight: bold;

        }


        /* ========================================
           SECTIONS
        ======================================== */

        .adminSection {

            padding: 25px;

        }


        .sectionTitle {

            margin-bottom: 20px;

            color:
                #3498DB;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

        }


        /* ========================================
           LABELS
        ======================================== */

        .adminSection label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            color: #999;

            font-size: 11px;

            letter-spacing: 1px;

        }


        /* ========================================
           INPUTS
        ======================================== */

        .adminSection input,
        .adminSection textarea {

            width: 100%;

            padding: 10px;

            background: #0d0d0d;

            border:
                1px solid #444;

            color: #ddd;

            font-family: inherit;

            font-size: 14px;

        }


        .adminSection textarea {

            resize: vertical;

            min-height: 100px;

        }


        .adminSection input:focus,
        .adminSection textarea:focus {

            outline: none;

            border-color:
                #3498DB;

        }


        /* ========================================
           BUTTON
        ======================================== */

        #updateGameState {

            margin-top: 25px;

            padding:
                11px 20px;

            background:
                #3498DB;

            border: none;

            color: white;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

        }


        #updateGameState:hover {

            filter:
                brightness(1.15);

        }


        #updateGameState:disabled {

            opacity: 0.5;

            cursor:
                not-allowed;

        }


        /* ========================================
           RESULT MESSAGE
        ======================================== */

        #updateResult {

            margin-top: 15px;

            min-height: 20px;

            font-size: 12px;

        }


        /* ========================================
           LOG OUT
        ======================================== */

        #logoutButton {

            margin:
                0 25px 25px 25px;

            padding:
                8px 15px;

            background:
                transparent;

            border:
                1px solid #555;

            color: #aaa;

            cursor: pointer;

        }


        #logoutButton:hover {

            border-color:
                #3498DB;

            color:
                #3498DB;

        }


        /* ========================================
           ACCESS DENIED
        ======================================== */

        #accessDenied {

            display: none;

            padding: 40px;

            text-align: center;

        }


        #accessDenied h2 {

            color:
                #e74c3c;

            letter-spacing: 2px;

        }

/* ========================================
   APPLICATION CONTROLS
======================================== */

#applicationsList {

    display: flex;

    flex-direction: column;

    gap: 8px;

}


.adminApplication {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px;

    background: #0d0d0d;

    border: 1px solid #333;

}


.adminApplicationInfo {

    display: flex;

    align-items: center;

    gap: 12px;

}


.adminApplicationIcon {

    width: 32px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 20px;

}


.adminApplicationName {

    color: #ddd;

    font-size: 13px;

}


.adminApplicationDescription {

    margin-top: 3px;

    color: #666;

    font-size: 10px;

}


/* ========================================
   UNLOCK BUTTON
======================================== */

.applicationToggle {

    width: 100px;
    min-width: 100px;
    height: 30px;

    padding: 0 12px;

    border: 1px solid #555;

    background: transparent;

    color: #888;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    flex-shrink: 0;

}


.applicationToggle:hover {

    border-color:
        #3498DB;

    color:
        #3498DB;

}


.applicationToggle.unlocked {

    border-color:
        #3498DB;

    color:
        #3498DB;

}


.applicationToggle.locked {

    border-color:
        #555;

    color:
        #666;

}


    </style>

</head>


<body>


    <!-- ========================================
         ADMIN PANEL
    ======================================== -->

    <div id="adminPanel">

        <div id="adminHeader">
            ARG CONTROL PANEL
        </div>


        <div id="adminInfo">

            USER:
            <span id="adminUsername">
                ---
            </span>

            &nbsp;&nbsp;|&nbsp;&nbsp;

            ACCESS LEVEL:
            <span id="adminAccessLevel">
                ---
            </span>

        </div>


        <!-- ========================================
             GAME STATE
        ======================================== -->

        <section
            class="adminSection"
            id="gameStateSection"
        >

            <div class="sectionTitle">
                GAME STATE
            </div>


            <label
                for="systemStatusInput"
            >
                SYSTEM STATUS
            </label>

            <input
                id="systemStatusInput"
                type="text"
                placeholder="ONLINE"
            >


            <label
                for="systemMessageInput"
            >
                SYSTEM MESSAGE
            </label>

            <textarea
                id="systemMessageInput"
                rows="4"
                placeholder="Enter system message..."
            ></textarea>


            <label
                for="chapterInput"
            >
                CURRENT CHAPTER
            </label>

            <input
                id="chapterInput"
                type="number"
                min="1"
                value="1"
            >


            <button
                id="updateGameState"
            >
                UPDATE SYSTEM
            </button>


            <div id="updateResult"></div>

        </section>

<!-- ========================================
     APPLICATIONS
======================================== -->

<section
    class="adminSection"
    id="applicationsSection"
>

    <div class="sectionTitle">
        APPLICATIONS
    </div>

    <div id="applicationsList">
        LOADING APPLICATIONS...
    </div>

</section>


        <button
            id="logoutButton"
        >
            LOG OUT
        </button>


        <!-- ========================================
             ACCESS DENIED
        ======================================== -->

        <div id="accessDenied">

            <h2>
                ACCESS DENIED
            </h2>

            <p>
                You do not have administrator
                privileges.
            </p>

        </div>

    </div>


    <!-- ========================================
         SUPABASE
    ======================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script>


        /* ========================================
           SUPABASE
        ======================================== */

        const SUPABASE_URL = "https://fyhxgigfatooxkxlxipz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vq5sbfZOEZV5SR1m0uuicw_W2Rqd6-L";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* ========================================
           ELEMENTS
        ======================================== */

        const adminPanel =
            document.getElementById(
                "adminPanel"
            );


        const gameStateSection =
            document.getElementById(
                "gameStateSection"
            );


        const accessDenied =
            document.getElementById(
                "accessDenied"
            );


        const adminUsername =
            document.getElementById(
                "adminUsername"
            );


        const adminAccessLevel =
            document.getElementById(
                "adminAccessLevel"
            );


        const systemStatusInput =
            document.getElementById(
                "systemStatusInput"
            );


        const systemMessageInput =
            document.getElementById(
                "systemMessageInput"
            );


        const chapterInput =
            document.getElementById(
                "chapterInput"
            );


        const updateGameState =
            document.getElementById(
                "updateGameState"
            );


        const updateResult =
            document.getElementById(
                "updateResult"
            );


        const logoutButton =
            document.getElementById(
                "logoutButton"
            );



        /* ========================================
           LOAD CURRENT GAME STATE
        ======================================== */

        async function loadGameState() {


            const {
                data: gameState,
                error
            } = await supabaseClient

                .from("game_state")

                .select(
                    "current_chapter, system_status, system_message"
                )

                .eq("id", 1)

                .single();


            if (error) {

                console.error(
                    "GAME STATE ERROR:",
                    error
                );

                updateResult.textContent =
                    "COULD NOT LOAD GAME STATE.";

                return;

            }


            systemStatusInput.value =
                gameState.system_status || "";


            systemMessageInput.value =
                gameState.system_message || "";


            chapterInput.value =
                gameState.current_chapter || 1;

        }



async function toggleApplication(
    application,
    button
) {

    /*
     * Prevent a second click while the
     * current database request is running.
     */

    if (button.dataset.updating === "true") {
        return;
    }


    button.dataset.updating = "true";


    /*
     * Read the CURRENT button state.
     */

    const currentState =
        button.dataset.unlocked === "true";


    const newState =
        !currentState;


    /*
     * Remember the old appearance.
     */

    updateApplicationButton(
        button,
        newState
    );


    console.log(
        "APPLICATION TOGGLE:",
        application.id,
        currentState,
        "→",
        newState
    );


    try {

        const {
            error
        } = await supabaseClient

            .from("applications")

            .update({
                unlocked: newState
            })

            .eq(
                "id",
                application.id
            );


        /*
         * Database error
         */

        if (error) {

            console.error(
                "APPLICATION UPDATE ERROR:",
                error
            );


            /*
             * Undo the visual change.
             */

            updateApplicationButton(
                button,
                currentState
            );


            return;

        }


        /*
         * Database succeeded.
         *
         * Update our local state.
         */

        application.unlocked =
            newState;


        button.dataset.unlocked =
            String(newState);


        console.log(
            "APPLICATION UPDATED:",
            application.id,
            newState
        );


    } catch (error) {

        console.error(
            "APPLICATION ERROR:",
            error
        );


        /*
         * Undo the visual change.
         */

        updateApplicationButton(
            button,
            currentState
        );


    } finally {

        /*
         * Allow another click.
         */

        button.dataset.updating =
            "false";

    }

}

function updateApplicationButton(
    button,
    unlocked
) {

    if (unlocked) {

        button.textContent =
            "UNLOCKED";

        button.classList.add(
            "unlocked"
        );

        button.classList.remove(
            "locked"
        );

    } else {

        button.textContent =
            "LOCKED";

        button.classList.add(
            "locked"
        );

        button.classList.remove(
            "unlocked"
        );

    }

}

async function loadApplications() {

    const applicationsList =
        document.getElementById(
            "applicationsList"
        );


    applicationsList.textContent =
        "LOADING APPLICATIONS...";


    const {
        data: applications,
        error
    } = await supabaseClient

        .from("applications")

        .select(
            "id, name, display_name, icon, description, unlocked"
        )

        .order(
            "id",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "APPLICATION ERROR:",
            error
        );

        applicationsList.textContent =
            "COULD NOT LOAD APPLICATIONS.";

        return;

    }


    applicationsList.innerHTML = "";


    applications.forEach(
        (application) => {

            /*
             * Create row
             */

const row =
    document.createElement(
        "div"
    );

row.className =
    "adminApplication";

row.dataset.applicationId =
    application.id;


            /*
             * Application information
             */

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "adminApplicationInfo";


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "adminApplicationIcon";

            icon.textContent =
                application.icon || "□";


            const text =
                document.createElement(
                    "div"
                );


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "adminApplicationName";

            name.textContent =
                application.display_name ||
                application.name;


            const description =
                document.createElement(
                    "div"
                );

            description.className =
                "adminApplicationDescription";

            description.textContent =
                application.description || "";


            text.appendChild(
                name
            );

            text.appendChild(
                description
            );


            info.appendChild(
                icon
            );

            info.appendChild(
                text
            );


            /*
 * Create toggle button
 */

const button =
    document.createElement(
        "button"
    );

button.className =
    "applicationToggle";


button.dataset.unlocked =
    String(application.unlocked);

button.dataset.updating =
    "false";


/*
 * Set initial appearance
 */

updateApplicationButton(
    button,
    application.unlocked
);


/*
 * Toggle application
 */

button.addEventListener(
    "click",
    () => {

        toggleApplication(
            application,
            button
        );

    }
);


            /*
             * Assemble row
             */

            row.appendChild(
                info
            );

            row.appendChild(
                button
            );


            applicationsList.appendChild(
                row
            );

        }
    );

}

        /* ========================================
           CHECK ADMIN
        ======================================== */

        async function checkAdmin() {


            /*
             * Check login
             */

            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth
                    .getSession();


            if (!session) {

                window.location.href =
                    "login.html";

                return;

            }



            /*
             * Get player profile
             */

            const {
                data: player,
                error
            } =
                await supabaseClient

                    .from("players")

                    .select(
                        "username, access_level"
                    )

                    .eq(
                        "user_id",
                        session.user.id
                    )

                    .single();



            if (error) {

                console.error(
                    "PLAYER ERROR:",
                    error
                );

                gameStateSection.style.display =
                    "none";

                return;

            }



            /*
             * Display player
             */

            adminUsername.textContent =
                player.username;


            adminAccessLevel.textContent =
                player.access_level;



            /*
             * Check administrator access
             *
             * 3 = administrator
             */

            if (
                player.access_level < 3
            ) {

                gameStateSection.style.display =
                    "none";

                accessDenied.style.display =
                    "block";

                return;

            }



            /*
             * Administrator
             */

            await loadGameState();
            await loadApplications();

        }



        /* ========================================
           UPDATE GAME STATE
        ======================================== */

        updateGameState.addEventListener(
            "click",
            async () => {


                updateResult.textContent =
                    "UPDATING...";


                updateGameState.disabled =
                    true;



                /*
                 * Get values
                 */

                const status =
                    systemStatusInput.value.trim();


                const message =
                    systemMessageInput.value.trim();


                const chapter =
                    Number(
                        chapterInput.value
                    );



                /*
                 * Validate chapter
                 */

                if (
                    !Number.isInteger(
                        chapter
                    ) ||
                    chapter < 1
                ) {

                    updateResult.textContent =
                        "INVALID CHAPTER.";

                    updateGameState.disabled =
                        false;

                    return;

                }



                /*
                 * ONE database update
                 *
                 * This changes all three
                 * values at once.
                 */

                const {
                    error
                } = await supabaseClient

                    .from("game_state")

                    .update({

                        system_status:
                            status,

                        system_message:
                            message,

                        current_chapter:
                            chapter

                    })

                    .eq(
                        "id",
                        1
                    );



                /*
                 * Error
                 */

                if (error) {

                    console.error(
                        "GAME STATE UPDATE ERROR:",
                        error
                    );

                    updateResult.textContent =
                        "UPDATE FAILED: " +
                        error.message;

                    updateGameState.disabled =
                        false;

                    return;

                }



                /*
                 * Success
                 */

                updateResult.textContent =
                    "SYSTEM UPDATED.";


                updateGameState.disabled =
                    false;

            }
        );



        /* ========================================
           LOG OUT
        ======================================== */

        logoutButton.addEventListener(
            "click",
            async () => {

                await supabaseClient
                    .auth
                    .signOut();

                window.location.href =
                    "login.html";

            }
        );



        /* ========================================
           START
        ======================================== */

        checkAdmin();


    </script>


</body>

</html>
