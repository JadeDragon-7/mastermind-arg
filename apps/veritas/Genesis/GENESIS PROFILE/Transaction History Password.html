<!DOCTYPE html>
<html>

<!-- Disable CTRL U -->

<script>
document.onkeydown = function(e) {
if (e.ctrlKey && e.keyCode === 85) {
return false;
}
};
</script>

<head>
  <title>Pin Required</title>
  <style>
    body {
      background-color: #000000;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin-top: 100px;
    }
    p {
      color:#680000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      
    }
    button {
      padding: 15px 30px;
      margin: 20px;
      font-size: 20px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
    }
    #message {
      margin-top: 30px;
      font-size: 18px;
      color: red;
    }

div.fade-in-text {
    animation: fadeIn 5s;
}

@keyframes fadeIn {
    0% { opacity: 0;}
    100% { opacity: 1;}
}

  </style>
</head>
<body>

<div class = "fade-in-text">

  <h1>Enter Pin</h1>
  
<!--06211999-->

  <button onclick="pressButton(0)">0</button>
  <button onclick="pressButton(1)">1</button>
  <button onclick="pressButton(2)">2</button>
  <button onclick="pressButton(3)">3</button>
  <button onclick="pressButton(4)">4</button>
  <button onclick="pressButton(5)">5</button>
  <button onclick="pressButton(6)">6</button>
  <button onclick="pressButton(7)">7</button>
  <button onclick="pressButton(8)">8</button>
  <button onclick="pressButton(9)">9</button>

  <br><br>
  <button onclick="submitCode()">Submit</button>
  <br>
  <p>MM/DD/YYYY</p>

  <div id="message"></div>

  <script>
    const correctSequence = [0, 6, 2, 1, 1, 9, 9, 9];
    let userInput = [];

    function pressButton(num) {
      if (userInput.length < 8) {
        userInput.push(num);
        document.getElementById("message").innerText = `${userInput.join("-")}`;
      }
    }

    function submitCode() {
      const messageEl = document.getElementById("message");

      if (userInput.length !== 8) {
        messageEl.innerText = "⚠️ Please enter 8 digits before submitting.";
        return;
      }

      const isCorrect = userInput.every((val, idx) => val === correctSequence[idx]);

      if (isCorrect) {
        messageEl.style.color = "lightgreen";
        messageEl.innerText = "Password Correct. Redirecting...";
        // Redirect after short delay
        setTimeout(() => {
          window.location.href = "Transaction History.html"; // replace with actual page
        }, 1000);
      } else {
        messageEl.style.color = "red";
        messageEl.innerText = "Incorrect Password.";
        userInput = [];
      }
    }
  </script>

</div>
</body>
</html>
