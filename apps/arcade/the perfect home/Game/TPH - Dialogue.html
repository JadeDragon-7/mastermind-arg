<style>

@font-face {

html,
body {

#story{

    width:800px;

    opacity:1;

    transition:opacity 2s ease;

}

#story.hide {
    opacity: 0;
}

#game {

    display:none;
    opacity:0;

    position:relative;

    width:1500px;
    height:700px;

    border:4px solid black;

    overflow:hidden;

    transform-origin:center center;
}

#game.show {
    opacity: 1;
    pointer-events: auto;
}

#fade {
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s;
}

#fade.active {
    opacity: 1;
}

#player {
    position: absolute;

    height: 32px;

    left: 50px;
    top: 50px;
}

    position: absolute;

    width: 48px;

    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.wall {
    position: absolute;
    background: rgb(0, 0, 0);
}

.transparent_wall {
    position: absolute;
    background: rgba(255, 0, 0, 0);
}

.npc {
    position: absolute;
    width: 48px;
    height: 48px;
    background-image: url("Images/Interact.png");

    background-repeat: no-repeat;
    background-position: center;
}

#dialogueBox {

    left: 50%;

    background: rgba(0,0,0,0.9);
    border: 2px solid #0877fd;
    color: white;

    box-sizing: border-box;

    display: none;

    z-index: 100;

    padding: 20px;
    font-size: 40px;
    font-family:'Riday';
}

#controlsBox {
    position: fixed;
    left: 20px;

    width: 220px;

    background: rgba(0,0,0,0.9);
    color: white;

    border: 2px solid oklch(47.747% 0.19594 29.223);

}

#controlsBox h3 {
    margin-top: 0;
    text-align: center;
}

#controlsBox p {
    margin: 8px 0;
    font-family: 'NicoVoide';
}

.trigger {
    position: absolute;
    background: rgba(0, 255, 0, 0);
}

#actionPrompt {
    position: absolute;

    padding: 5px 10px;

#gameContainer{

#credits {

#creditsContent {

    position: absolute;

}

@keyframes scrollCredits {

    }

#startPrompt {

}

#startPrompt.show {

}

#startPrompt.hide {

}

#fontPreload{

@keyframes blink {

<script>

window.onload = () => {

    if (DEV_MODE !== "normal") return;

    const prompt = document.getElementById("startPrompt");

    // Wait a moment before beginning the fade
    setTimeout(() => {

        prompt.classList.add("show");

        // After the fade finishes, start blinking
        setTimeout(() => {
            prompt.style.animation = "blink 2s ease-in-out infinite";
        }, 2000);

    }, 1000);

};

const DEV_MODE = "normal";

const storyMusic = document.getElementById("storyMusic");
const creditsMusic = document.getElementById("creditsMusic");

storyMusic.volume = 0;
creditsMusic.volume = 0;

const dialogue = [
    { text: "What are you doing here.",

    speed: 200,

},

    { text: "I'M SORRY.",

},

},

},

 },

 },

 },

 },

    { text: "Go to your room.",
    color: "Roslyn",
    speed: 200,
    pause: 1000
 },

    { text: "...I'M SORRY.",
    color: "Nico",
    speed: 150,
    pause: 100000
 },

];

const storyDiv = document.getElementById("story");
const typingSpeed = 180;
const STORY_START_DELAY = 6000;

let lineIndex = 0;
let charIndex = 0;
let currentSpan;
let typing = false;

function typeLine() {

    if (charIndex === 0) {
        currentSpan = document.createElement("span");
        currentSpan.className = dialogue[lineIndex].color;
        storyDiv.appendChild(currentSpan);
    }

    if (charIndex < dialogue[lineIndex].text.length) {

        currentSpan.textContent += dialogue[lineIndex].text.charAt(charIndex);
        charIndex++;

        const currentSpeed = dialogue[lineIndex].speed || typingSpeed;
        setTimeout(typeLine, currentSpeed);

    } else {

        storyDiv.appendChild(document.createElement("br"));
        storyDiv.appendChild(document.createElement("br"));

        lineIndex++;
        charIndex = 0;

        if (lineIndex < dialogue.length) {

            const pause = dialogue[lineIndex - 1].pause || 1000;
            setTimeout(typeLine, pause);

        } else {

            storyFinished();

        }
    }
}

function storyFinished() {

    const fade = document.getElementById("fade");

    fade.classList.add("active");

    setTimeout(() => {

        document.getElementById("story").style.display = "none";

        const game = document.getElementById("game");
        game.style.display = "block";

        requestAnimationFrame(() => {
            game.style.opacity = "1";
        });

        gameLoop();

        // Wait before removing black overlay
        setTimeout(() => {
            fade.classList.remove("active");
        }, 1000);

    }, 2000);
}

if (lineIndex >= dialogue.length) {
    storyFinished();
}

let storyStarted = false;

function startStory() {

    if (storyStarted) return;

    storyStarted = true;

    const prompt = document.getElementById("startPrompt");

    // Stop blinking
    prompt.style.animation = "none";

    // Force the browser to notice the animation stopping
    void prompt.offsetWidth;

    // Fade out
    prompt.classList.add("hide");

    // Wait for the fade to finish
setTimeout(() => {

    prompt.remove();

    // Start the music immediately
    fadeIn(storyMusic, 0.15, 200);

    // Wait before showing the first line
    setTimeout(() => {

        typeLine();

    }, STORY_START_DELAY);

}, 2000);

}







const player = document.getElementById("player");
const dialogueBox = document.getElementById("dialogueBox");

let playerX = 50;
let playerY = 415;
const moveSpeed = 3;

const keys = {};

let talking = false;
let currentNPC = null;
let dialogueLines = [];
let dialogueIndex = 0;
let typingInterval = null;

document.addEventListener("keydown", (e) => {

    if (
        DEV_MODE === "normal" &&
        !storyStarted &&
        e.code === "Space"
    ) {

        e.preventDefault();

        startStory();

        return;
    }

});

document.addEventListener("keydown", (e) => {

    keys[e.key] = true;

if (e.key.toLowerCase() === "e") {

    if (talking) return;

    const npc = findNearbyNPC();

    if (npc) {
        startDialogue(npc);
        return;
    }

    const trigger = findNearbyTrigger();

    if (trigger) {

        window.location.href =
            trigger.dataset.destination;

    }

}

if (e.code === "Space") {

    if (!talking) return;

    if (typing) return;

    nextDialogue();

}

});

document.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

function checkCollision(rect1, rect2) {

    return (
        rect1.left < rect2.right &&
        rect1.right > rect2.left &&
        rect1.top < rect2.bottom &&
        rect1.bottom > rect2.top
    );

}

function movePlayer() {

    if (talking) return;

    let newX = playerX;
    let newY = playerY;

    if (keys["ArrowUp"]) newY -= moveSpeed;
    if (keys["ArrowDown"]) newY += moveSpeed;
    if (keys["ArrowLeft"]) newX -= moveSpeed;
    if (keys["ArrowRight"]) newX += moveSpeed;

    player.style.left = newX + "px";
    player.style.top = newY + "px";

    const playerRect = player.getBoundingClientRect();

    let blocked = false;

    document.querySelectorAll(".wall").forEach(wall => {

        if (
            checkCollision(
                playerRect,
                wall.getBoundingClientRect()
            )
        ) {
            blocked = true;
        }

    });

    if (!blocked) {
        playerX = newX;
        playerY = newY;
    }

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";
}

function findNearbyNPC() {

    for (const npc of document.querySelectorAll(".npc")) {

        const playerRect = player.getBoundingClientRect();
        const npcRect = npc.getBoundingClientRect();

        const closeEnough =
            Math.abs(playerRect.left - npcRect.left) < 70 &&
            Math.abs(playerRect.top - npcRect.top) < 70;

        if (closeEnough) {
            return npc;
        }

    }

    return null;
}

function startDialogue(npc) {

    talking = true;
    currentNPC = npc;

    dialogueLines = JSON.parse(
        npc.dataset.dialogue
    );

    dialogueIndex = 0;

    dialogueBox.style.color =
        npc.dataset.color || "white";

    dialogueBox.style.display = "block";

const line = dialogueLines[dialogueIndex];

dialogueBox.style.color = line.color;
typeText(line.text, line.speed || 35);
}

function nextDialogue() {

    dialogueIndex++;

if (dialogueIndex >= dialogueLines.length) {

    talking = false;
    currentNPC = null;

    dialogueBox.style.display = "none";

    endGame();

    return;
}

const line = dialogueLines[dialogueIndex];

dialogueBox.style.color = line.color;
typeText(line.text, line.speed || 35);

}

function typeText(text, speed) {

    clearInterval(typingInterval);

    typing = true;

    dialogueBox.textContent = "";

    let index = 0;

    typingInterval = setInterval(() => {

        dialogueBox.textContent += text[index];
        index++;

        if (index >= text.length) {
            clearInterval(typingInterval);
            typing = false;
        }

    }, speed);

}

function findNearbyTrigger() {

    const playerRect =
        player.getBoundingClientRect();

    for (const trigger of document.querySelectorAll(".trigger")) {

        const triggerRect =
            trigger.getBoundingClientRect();

        if (
            checkCollision(
                playerRect,
                triggerRect
            )
        ) {
            return trigger;
        }
    }

    return null;
}


function gameLoop() {

    movePlayer();

    updatePrompt();

    requestAnimationFrame(gameLoop);

}

const actionPrompt =
    document.getElementById("actionPrompt");

function updatePrompt() {

    if (talking) {

        return;

    }

    const trigger = findNearbyTrigger();

    if (trigger) {

        actionPrompt.style.display = "block";

        actionPrompt.textContent =
            "Enter?";

        actionPrompt.style.left =
            trigger.offsetLeft + "px";

        actionPrompt.style.top =
            (trigger.offsetTop - 25) + "px";

        return;
    }

    actionPrompt.style.display = "none";
}

switch (DEV_MODE) {

    case "normal":
        // The story is started in window.onload
        break;

    case "game": {

        document.getElementById("story").style.display = "none";
        document.getElementById("fade").style.display = "none";

        const game = document.getElementById("game");

        game.style.display = "block";
        game.style.opacity = "1";

        gameLoop();

        break;
    }

case "credits": {

    document.getElementById("story").style.display = "none";
    document.getElementById("fade").style.display = "none";
    document.getElementById("gameContainer").style.display = "none";

    const credits = document.getElementById("credits");

    credits.style.display = "block";

    fadeIn(creditsMusic, 0.15, 3000);

    break;
    }
}

function endGame() {

    const game = document.getElementById("game");
    const fade = document.getElementById("fade");

    dialogueBox.style.display = "none";

    fadeOut(storyMusic, 3000);

    game.style.opacity = "0";

    setTimeout(() => {

        fade.classList.add("active");

        setTimeout(() => {

            document.getElementById("gameContainer").style.display = "none";

const credits = document.getElementById("credits");

credits.style.display = "block";

fadeIn(creditsMusic, 0.45, 3000);

requestAnimationFrame(() => {
    credits.style.opacity = "1";
});

fade.classList.remove("active");

// Wait before the credits begin scrolling
setTimeout(() => {

    document.getElementById("creditsContent").style.animationPlayState = "running";

}, 3000);

        }, 1000);

    }, 1000);

}

const credits = document.getElementById("creditsContent");

credits.addEventListener("animationend", () => {

    const creditsScreen = document.getElementById("credits");

    // Fade out the credits music
    fadeOut(creditsMusic, 2000);

    // Fade the credits to black
    creditsScreen.style.opacity = "0";

    setTimeout(() => {

        window.location.href = "TPH - Title.html";

    }, 2000);

});

const letters =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ";

document.querySelectorAll(".glitchText").forEach(startGlitch);

function startGlitch(element) {

    const original = element.dataset.text;

    const letterTimers = [];
    let current = original.split("");

    element.textContent = current.join("");

    for (let i = 0; i < original.length; i++) {

        if (original[i] === " ") continue;

        // Give each letter its own permanent speed
        letterTimers[i] = 60 + Math.random() * 1;

        glitchLetter(i);
    }

    function glitchLetter(index) {

        const delay = letterTimers[index];

        setTimeout(() => {

            if (Math.random() < 0.4) {

                current[index] =
                    letters[Math.floor(Math.random() * letters.length)];

            } else {

                current[index] = original[index];

            }

            element.textContent = current.join("");

            glitchLetter(index);

        }, delay);
    }
}

function fadeIn(audio, targetVolume = 0.5, duration = 3000) {

    audio.volume = 0;
    audio.play();

    const step = targetVolume / (duration / 50);

    const fade = setInterval(() => {

        if (audio.volume < targetVolume) {

            audio.volume = Math.min(audio.volume + step, targetVolume);

        } else {

            clearInterval(fade);

        }

    }, 50);

}

function fadeOut(audio, duration = 3000) {

    const step = audio.volume / (duration / 50);

    const fade = setInterval(() => {

        if (audio.volume > step) {

            audio.volume -= step;

        } else {

            audio.volume = 0;
            audio.pause();
            audio.currentTime = 0;

            clearInterval(fade);

        }

    }, 50);

}

const game = document.getElementById("game");

function resizeGame() {

    const scale = Math.min(
        window.innerWidth / 1500,
        window.innerHeight / 700
    );

    game.style.transform = `scale(${scale})`;

}

window.addEventListener("resize", resizeGame);

resizeGame();




</script>
