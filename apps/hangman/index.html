<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hangman</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   GAME
========================= */

#game {
    width: 900px;
    height: 650px;

    background: #1c1c1c;
    border: 3px solid #555;

    display: flex;
    flex-direction: column;
    align-items: center;

    position: relative;
}

/* =========================
   TITLE
========================= */

#title {
    width: 100%;
    text-align: center;

    font-size: 36px;
    letter-spacing: 6px;

    padding: 25px 0;

    border-bottom: 2px solid #444;
}

/* =========================
   GAME TABS
========================= */

#gameTabs {
    width: 100%;

    display: flex;
    justify-content: center;

    border-bottom: 2px solid #444;
}

.gameTab {
    padding: 12px 30px;

    background: #222;
    color: #aaa;

    border: none;
    border-right: 1px solid #444;

    cursor: pointer;

    font-size: 16px;
}

.gameTab:first-child {
    border-left: 1px solid #444;
}

.gameTab:hover {
    background: #333;
    color: white;
}

.gameTab.active {
    background: #444;
    color: white;
}

/* =========================
   GAME AREA
========================= */

#gameArea {
    width: 100%;
    flex: 1;

    display: flex;

    position: relative;
}

/* =====================================================
   HANGMAN
===================================================== */

#hangman {
    position: relative;
    width: 300px;
    height: 300px;
}


/* =====================================================
   PERMANENT GALLOWS
===================================================== */

.hangmanPart {
    position: absolute;
    background: black;
}


/* Base */

.base {
    width: 180px;
    height: 8px;

    left: 50px;
    bottom: 20px;
}


/* Vertical support */

.pole {
    width: 8px;
    height: 250px;

    left: 70px;
    bottom: 20px;
}


/* Top */

.top {
    width: 130px;
    height: 8px;

    left: 70px;
    top: 30px;
}


/* Rope */

.rope {
    width: 5px;
    height: 35px;

    left: 195px;
    top: 38px;
}


/* =====================================================
   HEAD
===================================================== */

.head {
    width: 55px;
    height: 55px;

    border: 6px solid black;
    border-radius: 50%;

    background: transparent;

    left: 167px;
    top: 68px;

    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

.body {
    width: 8px;
    height: 90px;

    left: 191px;
    top: 123px;
}


/* =====================================================
   LEFT ARM
===================================================== */

.leftArm {
    width: 8px;
    height: 65px;

    left: 151px;
    top: 130px;

    transform: rotate(55deg);
    transform-origin: top center;
}


/* =====================================================
   RIGHT ARM
===================================================== */

.rightArm {
    width: 8px;
    height: 65px;

    left: 231px;
    top: 130px;

    transform: rotate(-55deg);
    transform-origin: top center;
}


/* =====================================================
   LEFT LEG
===================================================== */

.leftLeg {
    width: 8px;
    height: 75px;

    left: 170px;
    top: 205px;

    transform: rotate(30deg);
    transform-origin: top center;
}


/* =====================================================
   RIGHT LEG
===================================================== */

.rightLeg {
    width: 8px;
    height: 75px;

    left: 212px;
    top: 205px;

    transform: rotate(-30deg);
    transform-origin: top center;
}

/* =========================
   WORD / LETTERS
========================= */

#guessArea {
    width: 55%;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 40px;
}

/* Word */

#word {
    display: flex;
    gap: 12px;

    margin-top: 40px;
    margin-bottom: 35px;

    min-height: 50px;
}

.letter {
    width: 40px;
    height: 50px;

    border-bottom: 3px solid white;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    font-size: 32px;
}

/* =========================
   STATUS
========================= */

#status {
    margin-bottom: 20px;

    font-size: 18px;
    color: #aaa;
}

#guessStatus {
    margin-bottom: 25px;

    font-size: 16px;
    letter-spacing: 3px;

    color: #aaa;
}

#guessStatus.locked {
    color: #777;
}

/* =========================
   LETTER BUTTONS
========================= */

#letters {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(6, 1fr);

    gap: 8px;

    max-width: 400px;
}

.letterButton {
    height: 42px;

    background: #292929;
    color: white;

    border: 1px solid #555;

    cursor: pointer;

    font-size: 16px;
}

.letterButton:hover {
    background: #444;
}

.letterButton:disabled {
    opacity: 0.35;
    cursor: default;
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    position: absolute;

    inset: 0;

    background: rgba(0, 0, 0, 0.9);

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

#gameOver h2 {
    font-size: 42px;
    letter-spacing: 5px;
}

#gameOver p {
    font-size: 20px;
    color: #aaa;
}

#resetButton {
    margin-top: 20px;

    padding: 12px 30px;

    background: #292929;
    color: white;

    border: 1px solid #777;

    cursor: pointer;

    font-size: 16px;
}

#resetButton:hover {
    background: #444;
}

</style>
</head>

<body>

<div id="game">

<div id="title">
    HANGMAN
</div>

<div id="gameTabs"></div>

<div id="gameArea">

        <!-- =========================
             HANGMAN DRAWING
        ========================== -->

        <div id="hangmanArea">

            <canvas
                id="hangmanCanvas"
                width="300"
                height="300">
            </canvas>

        </div>


        <!-- =========================
             GUESS AREA
        ========================== -->

        <div id="guessArea">

<div id="status">
    WRONG GUESSES: 0 / 6
</div>

<div id="guessStatus">
    UNLOCKED
</div>

            <div id="word"></div>

            <div id="letters"></div>

        </div>

    </div>


    <!-- =========================
         GAME OVER
    ========================= -->

    <div id="gameOver">

        <h2 id="gameOverTitle">
            GAME OVER
        </h2>

        <p id="gameOverMessage"></p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   GAME SETTINGS
===================================================== */

// Temporary test word.
//
// We will eventually remove this and retrieve the
// player's unique word from Supabase.

const { createClient } = supabase;

const SUPABASE_URL = "https://fyhxgigfatooxkxlxipz.supabase.co";
const SUPABASE_KEY = "sb_publishable_vq5sbfZOEZV5SR1m0uuicw_W2Rqd6-L";


const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const MAX_WRONG_GUESSES = 6;

let WORD = "";


/* =====================================================
   GAME STATE
===================================================== */

let guessedLetters = [];

let wrongGuesses = 0;


// All Hangman games assigned to this player
let games = [];


// Currently selected game
let currentGame = null;

let currentPlayerId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const gameTabsElement =
    document.getElementById("gameTabs");

const wordElement =
    document.getElementById("word");

const lettersElement =
    document.getElementById("letters");

const statusElement =
    document.getElementById("status");

const guessStatusElement =
    document.getElementById("guessStatus");

const canvas =
    document.getElementById("hangmanCanvas");

const ctx =
    canvas.getContext("2d");

const gameOverElement =
    document.getElementById("gameOver");

const gameOverTitle =
    document.getElementById("gameOverTitle");

const gameOverMessage =
    document.getElementById("gameOverMessage");


/* =====================================================
   CREATE GAME TABS
===================================================== */

function createGameTabs() {

    gameTabsElement.innerHTML = "";

    games.forEach((game, index) => {

        const tab =
            document.createElement("button");

        tab.classList.add("gameTab");

        tab.textContent =
            `GAME ${game.tab_number}`;

        tab.addEventListener(
            "click",
            function () {

                selectGame(index);

            }
        );

        gameTabsElement.appendChild(tab);

    });

}

function selectGame(index) {

    currentGame = games[index];

    // Load this game's data
    WORD =
        currentGame.word.toUpperCase();

    guessedLetters =
        currentGame.guessed_letters || [];

    wrongGuesses =
        currentGame.wrong_guesses || 0;


    // Update active tab
    const tabs =
        document.querySelectorAll(".gameTab");

    tabs.forEach((tab, tabIndex) => {

        tab.classList.toggle(
            "active",
            tabIndex === index
        );

    });


    // Create keyboard
    createLetterButtons();


    // Render game
    updateGame();


    // Apply the correct lock state
    updateGuessLockState();


    // Show permanent result if finished
    if (
        currentGame.status === "won" ||
        currentGame.status === "lost"
    ) {

        showGameOver(
            currentGame.status === "won"
        );

    } else {

        gameOverElement.style.display =
            "none";

    }

}

/* ========================================
   REALTIME HANGMAN UPDATES
======================================== */

function subscribeToHangmanGames() {

    if (!currentPlayerId) {
        console.error(
            "Cannot start Hangman Realtime: no player ID."
        );
        return;
    }


    supabaseClient
        .channel(`hangman-games-${currentPlayerId}`)
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "hangman_games",
                filter: `player_id=eq.${currentPlayerId}`
            },
            payload => {

                console.log(
                    "HANGMAN REALTIME UPDATE:",
                    payload
                );


                // Find the game that changed
                const updatedGame =
                    games.find(
                        game =>
                            game.id === payload.new.id
                    );


                if (!updatedGame) {
                    return;
                }


                // Update our local copy
                Object.assign(
                    updatedGame,
                    payload.new
                );


                // Only refresh the currently
                // displayed game
                if (
                    currentGame &&
                    currentGame.id === updatedGame.id
                ) {

                    currentGame =
                        updatedGame;


                    WORD =
                        currentGame.word.toUpperCase();

                    guessedLetters =
                        currentGame.guessed_letters || [];

                    wrongGuesses =
                        currentGame.wrong_guesses || 0;


                    // Rebuild keyboard
                    createLetterButtons();


                    // Refresh game
                    updateGame();


                    // Apply lock/unlock state
                    updateGuessLockState();


                    // Show permanent result
                    if (
                        currentGame.status === "won" ||
                        currentGame.status === "lost"
                    ) {

                        showGameOver(
                            currentGame.status === "won"
                        );

                    } else {

                        gameOverElement.style.display =
                            "none";

                    }

                }

            }
        )
        .subscribe(
            status => {

                console.log(
                    "HANGMAN REALTIME STATUS:",
                    status
                );

            }
        );

}

/* ========================================
   UPDATE GUESS LOCK STATE
======================================== */

function updateGuessLockState() {

    if (!currentGame) {
        return;
    }


    const buttons =
        document.querySelectorAll(
            ".letterButton"
        );


    /*
     * Finished games remain locked.
     */

    if (
        currentGame.status === "won" ||
        currentGame.status === "lost"
    ) {

        buttons.forEach(button => {

            button.disabled = true;

        });

        return;

    }


    /*
     * If the game is locked, disable
     * every letter button.
     */

    if (
        currentGame.guess_unlocked === false
    ) {

        buttons.forEach(button => {

            button.disabled = true;

        });

        return;

    }


    /*
     * Otherwise, only disable letters
     * that have already been guessed.
     */

    buttons.forEach(button => {

        button.disabled =
            guessedLetters.includes(
                button.textContent
            );

    });

}

/* =====================================================
   DRAW HANGMAN
===================================================== */

function drawHangman() {

    // Clear the canvas

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* =====================================================
       PERMANENT GALLOWS
       These NEVER count as wrong guesses.
    ===================================================== */

    ctx.strokeStyle = "black";
    ctx.lineWidth = 8;
    ctx.lineCap = "square";


    // Base

    ctx.beginPath();

    ctx.moveTo(50, 270);
    ctx.lineTo(230, 270);

    ctx.stroke();


    // Vertical support

    ctx.beginPath();

    ctx.moveTo(70, 270);
    ctx.lineTo(70, 30);

    ctx.stroke();


    // Top support

    ctx.beginPath();

    ctx.moveTo(70, 30);
    ctx.lineTo(200, 30);

    ctx.stroke();


    // Rope

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(195, 30);
    ctx.lineTo(195, 65);

    ctx.stroke();


    /* =====================================================
       PERSON
       1 = HEAD
       2 = BODY
       3 = LEFT ARM
       4 = RIGHT ARM
       5 = LEFT LEG
       6 = RIGHT LEG
    ===================================================== */


    ctx.strokeStyle = "black";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";


    // 1 — HEAD

    if (wrongGuesses >= 1) {

        ctx.beginPath();

        ctx.arc(
            195,
            90,
            25,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    // 2 — BODY

    if (wrongGuesses >= 2) {

        ctx.beginPath();

        ctx.moveTo(195, 115);
        ctx.lineTo(195, 190);

        ctx.stroke();

    }


    // 3 — LEFT ARM

    if (wrongGuesses >= 3) {

        ctx.beginPath();

        ctx.moveTo(195, 130);
        ctx.lineTo(155, 165);

        ctx.stroke();

    }


    // 4 — RIGHT ARM

    if (wrongGuesses >= 4) {

        ctx.beginPath();

        ctx.moveTo(195, 130);
        ctx.lineTo(235, 165);

        ctx.stroke();

    }


    // 5 — LEFT LEG

    if (wrongGuesses >= 5) {

        ctx.beginPath();

        ctx.moveTo(195, 190);
        ctx.lineTo(160, 240);

        ctx.stroke();

    }


    // 6 — RIGHT LEG

    if (wrongGuesses >= 6) {

        ctx.beginPath();

        ctx.moveTo(195, 190);
        ctx.lineTo(230, 240);

        ctx.stroke();

    }

}


/* =====================================================
   DISPLAY WORD
===================================================== */

function renderWord() {

    wordElement.innerHTML = "";

    for (let letter of WORD) {

        const letterElement =
            document.createElement("div");

        letterElement.classList.add("letter");

        if (guessedLetters.includes(letter)) {

            letterElement.textContent =
                letter;

        } else {

            letterElement.textContent =
                "";
        }

        wordElement.appendChild(
            letterElement
        );
    }
}


/* =====================================================
   CREATE LETTER BUTTONS
===================================================== */

function createLetterButtons() {

    lettersElement.innerHTML = "";

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    for (let letter of alphabet) {

        const button =
            document.createElement("button");

        button.classList.add(
            "letterButton"
        );

        button.textContent =
            letter;

        button.addEventListener(
            "click",
            function () {

                guessLetter(letter);

            }
        );

        lettersElement.appendChild(
            button
        );
    }
}


/* =====================================================
   GUESS LETTER
===================================================== */

async function guessLetter(letter) {

    // Make sure a game is selected

    if (!currentGame) {
        return;
    }


    // Finished games cannot be played

    if (
        currentGame.status === "won" ||
        currentGame.status === "lost"
    ) {
        return;
    }


    // Player must be unlocked

    if (currentGame.guess_unlocked !== true) {
        return;
    }


    // Prevent duplicate guesses

    if (guessedLetters.includes(letter)) {
        return;
    }


    // Save the game ID BEFORE doing anything async

    const gameId =
        currentGame.id;


    // Add the letter

    guessedLetters.push(letter);


    // Check whether the guess was wrong

    if (!WORD.includes(letter)) {

        wrongGuesses++;

    }


    // Increase guess number

    currentGame.guess_number =
        (currentGame.guess_number || 0) + 1;


    // LOCK the game

    currentGame.guess_unlocked =
        false;


    // Update local game state

    currentGame.guessed_letters =
        [...guessedLetters];

    currentGame.wrong_guesses =
        wrongGuesses;


    // Disable the letter that was just guessed

    const buttons =
        document.querySelectorAll(
            ".letterButton"
        );

    buttons.forEach(button => {

        if (
            button.textContent === letter
        ) {

            button.disabled = true;

        }

    });


    // Update the screen

    updateGame();


    // Save progress

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        console.error(
            "Cannot save progress: no player is logged in."
        );

        return;

    }


// Save the values for THIS game before
// making the asynchronous database request

const savedGuesses =
    [...guessedLetters];

const savedWrongGuesses =
    wrongGuesses;

const savedGuessNumber =
    currentGame.guess_number;

const savedUnlocked =
    false;


const { error } =
    await supabaseClient
        .from("hangman_games")
        .update({

            guessed_letters:
                savedGuesses,

            wrong_guesses:
                savedWrongGuesses,

            guess_number:
                savedGuessNumber,

            guess_unlocked:
                savedUnlocked

        })
        .eq(
            "id",
            gameId
        );


    if (error) {

        console.error(
            "Error saving Hangman progress:",
            error
        );

    } else {

        console.log(
            `Game ${currentGame.tab_number} guess saved and locked.`
        );

    }

}


/* =====================================================
   UPDATE GAME
===================================================== */

function updateGame() {

    renderWord();

    drawHangman();


    statusElement.textContent =
        `WRONG GUESSES: ${wrongGuesses} / ${MAX_WRONG_GUESSES}`;


    if (
        currentGame &&
        currentGame.guess_unlocked === true &&
        currentGame.status === "playing"
    ) {

        guessStatusElement.textContent =
            "UNLOCKED";

        guessStatusElement.classList.remove(
            "locked"
        );

    } else {

        guessStatusElement.textContent =
            "LOCKED";

        guessStatusElement.classList.add(
            "locked"
        );

    }


    checkGameState();

}


/* =====================================================
   CHECK WIN / LOSS
===================================================== */

function checkGameState() {

    // Check win

    const solved =
        [...WORD].every(letter =>
            guessedLetters.includes(letter)
        );


    if (solved) {

        endGame(true);

        return;
    }


    // Check loss

    if (
        wrongGuesses >= MAX_WRONG_GUESSES
    ) {

        endGame(false);

    }

}


/* =====================================================
   SHOW GAME OVER SCREEN
===================================================== */

function showGameOver(won) {

    gameOverElement.style.display =
        "flex";


    if (won) {

        gameOverTitle.textContent =
            "YOU WIN";

        gameOverMessage.textContent =
            "THE WORD HAS BEEN SOLVED.";

    } else {

        gameOverTitle.textContent =
            "GAME OVER";

        gameOverMessage.textContent =
            "THE HANGMAN IS COMPLETE.";

    }


    // Disable all letter buttons

    document
        .querySelectorAll(".letterButton")
        .forEach(button => {

            button.disabled = true;

        });

}


/* =====================================================
   END GAME
===================================================== */

async function endGame(won) {

    if (!currentGame) {
        return;
    }


    // Don't finish an already completed game

    if (
        currentGame.status === "won" ||
        currentGame.status === "lost"
    ) {

        showGameOver(
            currentGame.status === "won"
        );

        return;

    }


    // Determine result

    const newStatus =
        won ? "won" : "lost";


    // Permanently update local state

    currentGame.status =
        newStatus;

    currentGame.completed_at =
        new Date().toISOString();


    // Lock the game permanently

    currentGame.guess_unlocked =
        false;


    // Show result

    showGameOver(won);


    // Save game ID before async request

    const gameId =
        currentGame.id;


    const { error } =
        await supabaseClient
            .from("hangman_games")
            .update({

                status:
                    newStatus,

                completed_at:
                    currentGame.completed_at,

                guess_unlocked:
                    false

            })
            .eq(
                "id",
                gameId
            );


    if (error) {

        console.error(
            "Error saving game result:",
            error
        );

    } else {

        console.log(
            `Game ${currentGame.tab_number} finished: ${newStatus}`
        );

    }

}


/* =====================================================
   LOAD PLAYER GAME
===================================================== */

async function loadPlayerGame() {

    // Find the currently logged-in player

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    // Check for authentication error

    if (userError) {

        console.error(
            "Error getting player:",
            userError
        );

        statusElement.textContent =
            "ERROR LOADING PLAYER";

        return;
    }


    // Make sure someone is actually logged in

    if (!user) {

        console.error(
            "No player is currently logged in."
        );

        statusElement.textContent =
            "NO PLAYER LOGGED IN";

        return;
    }

currentPlayerId = user.id;

    // Find this player's Hangman game

const { data: loadedGames, error: gameError } = await supabaseClient
    .from("hangman_games")
    .select("*")
    .eq("player_id", user.id)
    .order("tab_number", { ascending: true });

    // Check for database error

if (gameError) {
    console.error("Error loading Hangman games:", gameError);
    statusElement.textContent = "ERROR LOADING GAME";
    return;
}

if (!loadedGames || loadedGames.length === 0) {
    statusElement.textContent = "NO GAME ASSIGNED";
    return;
}


// Store all games

games = loadedGames;


// Create the game tabs

createGameTabs();


// Select the first game

selectGame(0);

}


/* =====================================================
   START GAME
===================================================== */

async function startHangman() {

    await loadPlayerGame();

    subscribeToHangmanGames();

}

startHangman();

</script>

</body>
</html>
