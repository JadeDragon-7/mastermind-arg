<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hangman</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   GAME
========================= */

#game {
    width: 900px;
    height: 650px;

    background: #1c1c1c;
    border: 3px solid #555;

    display: flex;
    flex-direction: column;
    align-items: center;

    position: relative;
}

/* =========================
   TITLE
========================= */

#title {
    width: 100%;
    text-align: center;

    font-size: 36px;
    letter-spacing: 6px;

    padding: 25px 0;

    border-bottom: 2px solid #444;
}

/* =========================
   GAME TABS
========================= */

#gameTabs {
    width: 100%;

    display: flex;
    justify-content: center;

    border-bottom: 2px solid #444;
}

.gameTab {
    padding: 12px 30px;

    background: #222;
    color: #aaa;

    border: none;
    border-right: 1px solid #444;

    cursor: pointer;

    font-size: 16px;
}

.gameTab:first-child {
    border-left: 1px solid #444;
}

.gameTab:hover {
    background: #333;
    color: white;
}

.gameTab.active {
    background: #444;
    color: white;
}

/* =========================
   GAME AREA
========================= */

#gameArea {
    width: 100%;
    flex: 1;

    display: flex;
}

/* =========================
   HANGMAN
========================= */

#hangmanArea {
    width: 45%;

    display: flex;
    justify-content: center;
    align-items: center;

    border-right: 2px solid #444;
}

#hangmanCanvas {
    width: 300px;
    height: 300px;
}

/* =========================
   WORD / LETTERS
========================= */

#guessArea {
    width: 55%;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 40px;
}

/* Word */

#word {
    display: flex;
    gap: 12px;

    margin-top: 40px;
    margin-bottom: 35px;

    min-height: 50px;
}

.letter {
    width: 40px;
    height: 50px;

    border-bottom: 3px solid white;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    font-size: 32px;
}

/* =========================
   STATUS
========================= */

#status {
    margin-bottom: 20px;

    font-size: 18px;
    color: #aaa;
}

/* =========================
   LETTER BUTTONS
========================= */

#letters {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(6, 1fr);

    gap: 8px;

    max-width: 400px;
}

.letterButton {
    height: 42px;

    background: #292929;
    color: white;

    border: 1px solid #555;

    cursor: pointer;

    font-size: 16px;
}

.letterButton:hover {
    background: #444;
}

.letterButton:disabled {
    opacity: 0.35;
    cursor: default;
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    position: absolute;

    inset: 0;

    background: rgba(0, 0, 0, 0.9);

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

#gameOver h2 {
    font-size: 42px;
    letter-spacing: 5px;
}

#gameOver p {
    font-size: 20px;
    color: #aaa;
}

#resetButton {
    margin-top: 20px;

    padding: 12px 30px;

    background: #292929;
    color: white;

    border: 1px solid #777;

    cursor: pointer;

    font-size: 16px;
}

#resetButton:hover {
    background: #444;
}

</style>
</head>

<body>

<div id="game">

<div id="title">
    HANGMAN
</div>

<div id="gameTabs"></div>

<div id="gameArea">

        <!-- =========================
             HANGMAN DRAWING
        ========================== -->

        <div id="hangmanArea">

            <canvas
                id="hangmanCanvas"
                width="300"
                height="300">
            </canvas>

        </div>


        <!-- =========================
             GUESS AREA
        ========================== -->

        <div id="guessArea">

            <div id="status">
                WRONG GUESSES: 0 / 6
            </div>

            <div id="word"></div>

            <div id="letters"></div>

        </div>

    </div>


    <!-- =========================
         GAME OVER
    ========================== -->

    <div id="gameOver">

        <h2 id="gameOverTitle">
            GAME OVER
        </h2>

        <p id="gameOverMessage"></p>

        <button id="resetButton">
            PLAY AGAIN
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   GAME SETTINGS
===================================================== */

// Temporary test word.
//
// We will eventually remove this and retrieve the
// player's unique word from Supabase.

const { createClient } = supabase;

const SUPABASE_URL = "https://fyhxgigfatooxkxlxipz.supabase.co";
const SUPABASE_KEY = "sb_publishable_vq5sbfZOEZV5SR1m0uuicw_W2Rqd6-L";


const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const MAX_WRONG_GUESSES = 6;

let WORD = "";


/* =====================================================
   GAME STATE
===================================================== */

let guessedLetters = [];

let wrongGuesses = 0;


// All Hangman games assigned to this player
let games = [];


// Currently selected game
let currentGame = null;


/* =====================================================
   ELEMENTS
===================================================== */

const gameTabsElement =
    document.getElementById("gameTabs");

const wordElement =
    document.getElementById("word");

const lettersElement =
    document.getElementById("letters");

const statusElement =
    document.getElementById("status");

const canvas =
    document.getElementById("hangmanCanvas");

const ctx =
    canvas.getContext("2d");

const gameOverElement =
    document.getElementById("gameOver");

const gameOverTitle =
    document.getElementById("gameOverTitle");

const gameOverMessage =
    document.getElementById("gameOverMessage");

const resetButton =
    document.getElementById("resetButton");


/* =====================================================
   CREATE GAME TABS
===================================================== */

function createGameTabs() {

    gameTabsElement.innerHTML = "";

    games.forEach((game, index) => {

        const tab =
            document.createElement("button");

        tab.classList.add("gameTab");

        tab.textContent =
            `GAME ${game.tab_number}`;

        tab.addEventListener(
            "click",
            function () {

                selectGame(index);

            }
        );

        gameTabsElement.appendChild(tab);

    });

}

/* =====================================================
   SELECT GAME
===================================================== */

function selectGame(index) {

    currentGame = games[index];

    WORD =
        currentGame.word.toUpperCase();

    guessedLetters =
        currentGame.guessed_letters || [];

    wrongGuesses =
        currentGame.wrong_guesses || 0;

    // Update active tab

    const tabs =
        document.querySelectorAll(".gameTab");

    tabs.forEach((tab, tabIndex) => {

        tab.classList.toggle(
            "active",
            tabIndex === index
        );

    });

    // Hide game over screen

    gameOverElement.style.display =
        "none";

    // Recreate buttons

    createLetterButtons();

    // Disable previously guessed letters

    const buttons =
        document.querySelectorAll(
            ".letterButton"
        );

    buttons.forEach(button => {

        if (
            guessedLetters.includes(
                button.textContent
            )
        ) {

            button.disabled = true;

        }

    });

    // Display selected game

    updateGame();

}

/* =====================================================
   DRAW HANGMAN
===================================================== */

function drawHangman() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;

    /*
        Each wrong guess adds another part.

        1 = base
        2 = vertical pole
        3 = top
        4 = rope
        5 = head
        6 = body
        7 = arms
        8 = legs

        We'll eventually decide exactly how many
        mistakes you want the player to have.
    */

    if (wrongGuesses >= 1) {

        ctx.beginPath();

        ctx.moveTo(40, 260);
        ctx.lineTo(180, 260);

        ctx.stroke();
    }

    if (wrongGuesses >= 2) {

        ctx.beginPath();

        ctx.moveTo(70, 260);
        ctx.lineTo(70, 40);

        ctx.stroke();
    }

    if (wrongGuesses >= 3) {

        ctx.beginPath();

        ctx.moveTo(70, 40);
        ctx.lineTo(180, 40);

        ctx.stroke();
    }

    if (wrongGuesses >= 4) {

        ctx.beginPath();

        ctx.moveTo(180, 40);
        ctx.lineTo(180, 75);

        ctx.stroke();
    }

    if (wrongGuesses >= 5) {

        ctx.beginPath();

        ctx.arc(
            180,
            100,
            25,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    if (wrongGuesses >= 6) {

        ctx.beginPath();

        ctx.moveTo(180, 125);
        ctx.lineTo(180, 190);

        ctx.stroke();
    }

    if (wrongGuesses >= 7) {

        ctx.beginPath();

        ctx.moveTo(180, 145);
        ctx.lineTo(145, 170);

        ctx.moveTo(180, 145);
        ctx.lineTo(215, 170);

        ctx.stroke();
    }

    if (wrongGuesses >= 8) {

        ctx.beginPath();

        ctx.moveTo(180, 190);
        ctx.lineTo(150, 230);

        ctx.moveTo(180, 190);
        ctx.lineTo(210, 230);

        ctx.stroke();
    }
}


/* =====================================================
   DISPLAY WORD
===================================================== */

function renderWord() {

    wordElement.innerHTML = "";

    for (let letter of WORD) {

        const letterElement =
            document.createElement("div");

        letterElement.classList.add("letter");

        if (guessedLetters.includes(letter)) {

            letterElement.textContent =
                letter;

        } else {

            letterElement.textContent =
                "";
        }

        wordElement.appendChild(
            letterElement
        );
    }
}


/* =====================================================
   CREATE LETTER BUTTONS
===================================================== */

function createLetterButtons() {

    lettersElement.innerHTML = "";

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    for (let letter of alphabet) {

        const button =
            document.createElement("button");

        button.classList.add(
            "letterButton"
        );

        button.textContent =
            letter;

        button.addEventListener(
            "click",
            function () {

                guessLetter(letter);

            }
        );

        lettersElement.appendChild(
            button
        );
    }
}


/* =====================================================
   GUESS LETTER
===================================================== */

async function guessLetter(letter) {

    // Prevent duplicate guesses

    if (
        guessedLetters.includes(letter)
    ) {
        return;
    }


    // Add the letter to the guessed letters

    guessedLetters.push(letter);


    // Disable button

    const buttons =
        document.querySelectorAll(
            ".letterButton"
        );

    buttons.forEach(button => {

        if (
            button.textContent === letter
        ) {

            button.disabled = true;

        }

    });


    // Check whether letter exists

    if (!WORD.includes(letter)) {

        wrongGuesses++;

    }


    // Update the game visually

    updateGame();


    // Save progress to Supabase

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        console.error(
            "Cannot save progress: no player is logged in."
        );

        return;
    }


    const { error } = await supabaseClient
        .from("hangman_games")
        .update({
            guessed_letters: guessedLetters,
            wrong_guesses: wrongGuesses
        })
        .eq("id", currentGame.id)


    if (error) {

        console.error(
            "Error saving Hangman progress:",
            error
        );

    } else {

        console.log(
            "Hangman progress saved."
        );

    }

}


/* =====================================================
   UPDATE GAME
===================================================== */

function updateGame() {

    renderWord();

    drawHangman();

    statusElement.textContent =
        `WRONG GUESSES: ${wrongGuesses} / ${MAX_WRONG_GUESSES}`;


    checkGameState();

}


/* =====================================================
   CHECK WIN / LOSS
===================================================== */

function checkGameState() {

    // Check win

    const solved =
        [...WORD].every(letter =>
            guessedLetters.includes(letter)
        );


    if (solved) {

        endGame(true);

        return;
    }


    // Check loss

    if (
        wrongGuesses >= MAX_WRONG_GUESSES
    ) {

        endGame(false);

    }

}


/* =====================================================
   END GAME
===================================================== */

function endGame(won) {

    gameOverElement.style.display =
        "flex";


    if (won) {

        gameOverTitle.textContent =
            "YOU WIN";

        gameOverMessage.textContent =
            `THE WORD WAS: ${WORD}`;

    } else {

        gameOverTitle.textContent =
            "GAME OVER";

        gameOverMessage.textContent =
            `THE WORD WAS: ${WORD}`;

    }


    // Disable all buttons

    const buttons =
        document.querySelectorAll(
            ".letterButton"
        );

    buttons.forEach(button => {

        button.disabled = true;

    });

}


/* =====================================================
   RESET
===================================================== */

function resetGame() {

    guessedLetters = [];

    wrongGuesses = 0;

    gameOverElement.style.display =
        "none";

    createLetterButtons();

    updateGame();

}


/* =====================================================
   RESET BUTTON
===================================================== */

resetButton.addEventListener(
    "click",
    resetGame
);


/* =====================================================
   LOAD PLAYER GAME
===================================================== */

async function loadPlayerGame() {

    // Find the currently logged-in player

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    // Check for authentication error

    if (userError) {

        console.error(
            "Error getting player:",
            userError
        );

        statusElement.textContent =
            "ERROR LOADING PLAYER";

        return;
    }


    // Make sure someone is actually logged in

    if (!user) {

        console.error(
            "No player is currently logged in."
        );

        statusElement.textContent =
            "NO PLAYER LOGGED IN";

        return;
    }


    // Find this player's Hangman game

const { data: loadedGames, error: gameError } = await supabaseClient
    .from("hangman_games")
    .select("*")
    .eq("player_id", user.id)
    .order("tab_number", { ascending: true });

    // Check for database error

if (gameError) {
    console.error("Error loading Hangman games:", gameError);
    statusElement.textContent = "ERROR LOADING GAME";
    return;
}

if (!loadedGames || loadedGames.length === 0) {
    statusElement.textContent = "NO GAME ASSIGNED";
    return;
}


// Store all games

games = loadedGames;


// Create the game tabs

createGameTabs();


// Select the first game

selectGame(0);

}


/* =====================================================
   START GAME
===================================================== */

loadPlayerGame();

</script>

</body>
</html>
