<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            width: 320px;
            padding: 30px;

            border: 1px solid #444;
            background: #181818;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            margin-bottom: 15px;
            padding: 12px;

            background: #111;
            color: white;

            border: 1px solid #444;
        }

        button {
            width: 100%;
            padding: 12px;

            background: #333;
            color: white;

            border: 1px solid #555;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>ACCESS</h1>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="loginButton">
            LOGIN
        </button>

        <div id="message"></div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://fyhxgigfatooxkxlxipz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vq5sbfZOEZV5SR1m0uuicw_W2Rqd6-L";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginButton.addEventListener("click", async () => {

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        message.textContent = "Logging in...";

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

if (error) {

    console.error("LOGIN ERROR:", error);

    message.textContent = error.message;

    return;
}
        message.textContent = "ACCESS GRANTED";

        console.log("Logged in:", data.user);

        // We'll redirect to the actual ARG here later.
        window.location.href = "game.html";
    });
</script>

</body>
</html>
